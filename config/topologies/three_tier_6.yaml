# Three-Tier 6-Access Topology Configuration
# Medium enterprise/campus network design
#
# Structure:
#   - 6 Access switches (edge layer)
#   - 2 Distribution switches (aggregation layer)
#   - 2 Core switches (backbone)
#   - 2 hosts per access switch = 12 total hosts
#   - Pods: Access 1-3 -> Dist 1, Access 4-6 -> Dist 2
#   - Total: 10 switches

version: "1.0"

topology:
  type: "three-tier"
  name: "three-tier-6"

three_tier:
  access_switches: 6
  distribution_switches: 2
  core_switches: 2
  hosts_per_access: 2
  pods:
    - access: [1, 2, 3]
      distribution: [1]
    - access: [4, 5, 6]
      distribution: [2]

switch_naming:
  leaf_prefix: "leaf"
  spine_prefix: "spine"
  core_prefix: "core"
  access_prefix: "access"
  distribution_prefix: "dist"
  host_prefix: "h"
  collector_prefix: "h"
  collector_id_base: 100

switch_defaults:
  p4_source: "p4src/int_md.p4"
  priority_queues: 8
  thrift_port_base: 9200

link_bandwidths:
  host_leaf: 10
  leaf_spine: 5
  spine_core: 10
  host_access: 10
  access_distribution: 5
  distribution_core: 10

int_collectors:
  ratio: 4
  ip_base: "172.16"
  port: 10

qos_queues:
  - id: 0
    name: "voice"
    dscp: "0x2E"
    sla_ms: 100
  - id: 1
    name: "video"
    dscp: "0x18"
    sla_ms: 150
  - id: 7
    name: "best_effort"
    dscp: "0x00"
    sla_ms: 200
