# Three-Tier Hierarchical Topology Configuration
# Classic enterprise/campus network design
#
# Structure:
#   - 4 Access switches (edge layer)
#   - 2 Distribution switches (aggregation layer)
#   - 2 Core switches (backbone)
#   - 2 hosts per access switch = 8 total hosts
#   - Pods: Access 1-2 connect to Dist 1, Access 3-4 connect to Dist 2
#   - Total: 8 switches (well within MAX_SWITCHES=20 limit)

version: "1.0"

topology:
  type: "three-tier"
  name: "three-tier-enterprise"

three_tier:
  access_switches: 4
  distribution_switches: 2
  core_switches: 2
  hosts_per_access: 2
  pods:
    - access: [1, 2]
      distribution: [1]
    - access: [3, 4]
      distribution: [2]

switch_naming:
  leaf_prefix: "leaf"           # Not used directly
  spine_prefix: "spine"         # Not used directly
  core_prefix: "core"           # core1, core2
  access_prefix: "access"       # access1, access2, access3, access4
  distribution_prefix: "dist"   # dist1, dist2
  host_prefix: "h"
  collector_prefix: "h"
  collector_id_base: 100

switch_defaults:
  p4_source: "p4src/int_md.p4"
  priority_queues: 8
  thrift_port_base: 9200

link_bandwidths:
  host_leaf: 10
  leaf_spine: 5
  spine_core: 10
  host_access: 10         # Host-Access: 10 Mbps
  access_distribution: 5  # Access-Distribution: 5 Mbps (bottleneck)
  distribution_core: 10   # Distribution-Core: 10 Mbps

int_collectors:
  ratio: 4                # One collector per 4 access switches (1 collector)
  ip_base: "172.16"
  port: 10

qos_queues:
  - id: 0
    name: "voice"
    dscp: "0x2E"
    sla_ms: 100
  - id: 1
    name: "video"
    dscp: "0x18"
    sla_ms: 150
  - id: 7
    name: "best_effort"
    dscp: "0x00"
    sla_ms: 200

# Traffic pairs: cross-pod communication
# Pod1: access1(h1,h2), access2(h3,h4) -> dist1
# Pod2: access3(h5,h6), access4(h7,h8) -> dist2
traffic:
  pairs:
    # Pod1 senders -> Pod2
    - {src: h1, dst: h6}
    - {src: h1, dst: h8}
    - {src: h3, dst: h6}
    - {src: h3, dst: h8}
    # Pod2 senders -> Pod1
    - {src: h5, dst: h2}
    - {src: h5, dst: h4}
    - {src: h7, dst: h2}
    - {src: h7, dst: h4}
