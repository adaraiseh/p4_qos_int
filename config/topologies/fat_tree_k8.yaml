# Fat-Tree k=8 Topology Configuration
# Larger fat-tree for higher capacity scenarios
#
# CAUTION: This topology has 80 switches which EXCEEDS the MAX_SWITCHES=20 limit.
# It is provided as a reference but will fail validation.
# For larger topologies, increase MAX_SWITCHES in config/schema.py
#
# Structure:
#   - 8 pods (k=8)
#   - 4 ToR switches per pod (k/2 = 4) = 32 total
#   - 4 Aggregation switches per pod (k/2 = 4) = 32 total
#   - 16 Core switches ((k/2)^2 = 16)
#   - 4 hosts per ToR (k/2 = 4) = 128 total hosts
#   - Total: 80 switches (EXCEEDS MAX_SWITCHES=20)

version: "1.0"

topology:
  type: "fat-tree"
  name: "fat-tree-k8"

fat_tree:
  k: 8

switch_naming:
  leaf_prefix: "leaf"    # leaf1-leaf32
  spine_prefix: "spine"  # spine1-spine32
  core_prefix: "core"    # core1-core16
  host_prefix: "h"
  collector_prefix: "h"
  collector_id_base: 100

switch_defaults:
  p4_source: "p4src/int_md.p4"
  priority_queues: 8
  thrift_port_base: 9200

link_bandwidths:
  host_leaf: 10      # Host-Leaf: 10 Mbps
  leaf_spine: 5      # Leaf-Spine: 5 Mbps
  spine_core: 10     # Spine-Core: 10 Mbps
  host_access: 10
  access_distribution: 5
  distribution_core: 10

int_collectors:
  ratio: 4           # One collector per 4 leaf switches (8 collectors for k=8)
  ip_base: "172.16"
  port: 10

qos_queues:
  - id: 0
    name: "voice"
    dscp: "0x2E"
    sla_ms: 100
  - id: 1
    name: "video"
    dscp: "0x18"
    sla_ms: 150
  - id: 7
    name: "best_effort"
    dscp: "0x00"
    sla_ms: 200

# Traffic: use pattern-based generation for large topology
# 128 hosts across 8 pods (16 hosts per pod)
traffic:
  pattern: "cross_pod"
  pod_size: 4
