# Leaf-Spine 6x2 Topology Configuration
# Medium-scale two-tier topology
#
# Structure:
#   - 6 Leaf switches
#   - 2 Spine switches
#   - 2 hosts per leaf = 12 total hosts
#   - Full mesh between leaves and spines
#   - Total: 8 switches

version: "1.0"

topology:
  type: "leaf-spine"
  name: "leaf-spine-6x2"

leaf_spine:
  num_leaves: 6
  num_spines: 2
  hosts_per_leaf: 2

switch_naming:
  leaf_prefix: "leaf"
  spine_prefix: "spine"
  core_prefix: "core"
  host_prefix: "h"
  collector_prefix: "h"
  collector_id_base: 100

switch_defaults:
  p4_source: "p4src/int_md.p4"
  priority_queues: 8
  thrift_port_base: 9200

link_bandwidths:
  host_leaf: 10
  leaf_spine: 5
  spine_core: 10
  host_access: 10
  access_distribution: 5
  distribution_core: 10

int_collectors:
  ratio: 4
  ip_base: "172.16"
  port: 10

qos_queues:
  - id: 0
    name: "voice"
    dscp: "0x2E"
    sla_ms: 100
  - id: 1
    name: "video"
    dscp: "0x18"
    sla_ms: 150
  - id: 7
    name: "best_effort"
    dscp: "0x00"
    sla_ms: 200

# Traffic pairs: cross-leaf communication
# Hosts are: h1,h2 (leaf1), h3,h4 (leaf2), h5,h6 (leaf3), h7,h8 (leaf4), h9,h10 (leaf5), h11,h12 (leaf6)
traffic:
  pairs:
    # Leaf1 senders -> other leaves
    - {src: h1, dst: h4}
    - {src: h1, dst: h6}
    - {src: h1, dst: h8}
    # Leaf2 senders -> other leaves
    - {src: h3, dst: h2}
    - {src: h3, dst: h6}
    - {src: h3, dst: h10}
    # Leaf3 senders -> other leaves
    - {src: h5, dst: h2}
    - {src: h5, dst: h8}
    - {src: h5, dst: h12}
    # Leaf4 senders -> other leaves
    - {src: h7, dst: h4}
    - {src: h7, dst: h10}
    - {src: h7, dst: h12}
    # Leaf5 senders -> other leaves
    - {src: h9, dst: h2}
    - {src: h9, dst: h6}
    - {src: h9, dst: h12}
    # Leaf6 senders -> other leaves
    - {src: h11, dst: h4}
    - {src: h11, dst: h8}
    - {src: h11, dst: h10}
